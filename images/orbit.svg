<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760">
<style>
.orbit-lines{transform-box:view-box;transform-origin:475px 370px;animation:orbit-list-turn 95s linear infinite}
.orbit-sun{transform-box:view-box;transform-origin:475px 370px;animation:orbit-list-pulse 9s ease-in-out infinite}
@keyframes orbit-list-turn{to{transform:rotate(360deg)}}
@keyframes orbit-list-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@media(prefers-reduced-motion:reduce){.orbit-lines,.orbit-sun{animation:none!important}}
</style>
<defs>
  <radialGradient id="sun"><stop stop-color="#f4ffb9"/><stop offset=".35" stop-color="#c7ed65"/><stop offset="1" stop-color="#8cab45"/></radialGradient>
  <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f0d8"/><stop offset=".5" stop-color="#93a77a"/><stop offset="1" stop-color="#263f40"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#334b3b" opacity=".22"/></pattern>
</defs>
<rect width="900" height="760" fill="#dce5ca"/><rect width="900" height="760" fill="url(#dots)"/>
<g class="orbit-lines"><circle cx="475" cy="370" r="236" fill="none" stroke="#263f35" stroke-width="1.4" opacity=".55" transform="rotate(-24 475 370)"/><ellipse cx="475" cy="370" rx="345" ry="125" fill="none" stroke="#263f35" stroke-width="1.4" opacity=".6" transform="rotate(-27 475 370)"/><ellipse cx="475" cy="370" rx="310" ry="190" fill="none" stroke="#75875d" stroke-width="1" opacity=".8" transform="rotate(48 475 370)"/></g>
<g class="orbit-sun"><circle cx="475" cy="370" r="145" fill="url(#sun)"/><circle cx="475" cy="370" r="112" fill="none" stroke="#f4ffca" stroke-width="1" opacity=".6"/><path d="M370 330c54-54 148-66 208-25M354 405c64 56 151 62 237 18M419 248c-27 48-35 92-26 135" fill="none" stroke="#718a3e" stroke-width="12" stroke-linecap="round" opacity=".26"/></g>
<circle cx="168" cy="208" r="40" fill="#3556d8"/><path d="M132 212c24-27 54-35 74-24" fill="none" stroke="#b7c4fa" stroke-width="7" opacity=".65"/>
<circle cx="735" cy="548" r="18" fill="#263f35"/><circle cx="735" cy="548" r="7" fill="#d4ef83"/>
<circle cx="278" cy="590" r="9" fill="#7b913f"/><circle cx="655" cy="130" r="5" fill="#263f35"/><path d="M660 126l30-20m-30 20l28 25" stroke="#263f35" stroke-width="1"/>
<g fill="#263f35" font-family="monospace" font-size="13"><text x="82" y="92">ORBITAL SYSTEM / 001</text><text x="674" y="680">∞</text></g>
</svg>
